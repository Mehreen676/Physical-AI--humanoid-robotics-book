<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Icon for Chat Widget -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3578e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e5bb8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Robot Head -->
  <rect x="8" y="10" width="24" height="20" rx="3" fill="url(#iconGradient)" stroke="#1e5bb8" stroke-width="1.5"/>

  <!-- Antenna -->
  <line x1="20" y1="10" x2="20" y2="5" stroke="#1e5bb8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="20" cy="4" r="2" fill="#ff6b6b"/>

  <!-- Eyes -->
  <circle cx="15" cy="18" r="2.5" fill="white"/>
  <circle cx="25" cy="18" r="2.5" fill="white"/>
  <circle cx="15.5" cy="18" r="1.2" fill="#1e5bb8"/>
  <circle cx="25.5" cy="18" r="1.2" fill="#1e5bb8"/>

  <!-- Smile -->
  <path d="M 13 23 Q 20 26 27 23" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Body -->
  <rect x="12" y="30" width="16" height="8" rx="2" fill="url(#iconGradient)" stroke="#1e5bb8" stroke-width="1.5"/>
</svg>
