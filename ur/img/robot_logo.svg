<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Logo for Navbar -->
  <defs>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3578e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e5bb8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Robot Head -->
  <rect x="60" y="70" width="80" height="70" rx="10" fill="url(#robotGradient)" stroke="#1e5bb8" stroke-width="3"/>

  <!-- Antenna -->
  <line x1="100" y1="70" x2="100" y2="50" stroke="#1e5bb8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="45" r="8" fill="#ff6b6b"/>

  <!-- Eyes -->
  <circle cx="80" cy="95" r="8" fill="white"/>
  <circle cx="120" cy="95" r="8" fill="white"/>
  <circle cx="82" cy="95" r="4" fill="#1e5bb8"/>
  <circle cx="122" cy="95" r="4" fill="#1e5bb8"/>

  <!-- Smile -->
  <path d="M 75 115 Q 100 125 125 115" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Body -->
  <rect x="70" y="140" width="60" height="50" rx="8" fill="url(#robotGradient)" stroke="#1e5bb8" stroke-width="3"/>

  <!-- Arms -->
  <rect x="45" y="150" width="20" height="35" rx="5" fill="#3578e5" stroke="#1e5bb8" stroke-width="2"/>
  <rect x="135" y="150" width="20" height="35" rx="5" fill="#3578e5" stroke="#1e5bb8" stroke-width="2"/>

  <!-- Chest Detail -->
  <rect x="85" y="155" width="30" height="25" rx="3" fill="white" opacity="0.3"/>
  <circle cx="100" cy="165" r="3" fill="#ff6b6b"/>
</svg>
