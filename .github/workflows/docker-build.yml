name: Docker Build & Test

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3009,DL3013

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug

  test-image:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image locally
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: bookrag:test
          cache-from: type=gha

      - name: Test image startup
        run: |
          docker run --rm -d \
            -e DATABASE_URL="postgresql://test:test@localhost/test" \
            -e QDRANT_URL="https://test.gcp.cloud.qdrant.io:6333" \
            -e QDRANT_API_KEY="test-key" \
            -e OPENROUTER_API_KEY="test-key" \
            -p 10000:10000 \
            --name bookrag-test \
            bookrag:test

          # Wait for startup
          sleep 10

          # Check if container is still running
          if ! docker ps | grep -q bookrag-test; then
            echo "Container failed to start"
            docker logs bookrag-test
            exit 1
          fi

          echo "Container started successfully"

      - name: Test health endpoint
        continue-on-error: true
        run: |
          # Health check may fail due to missing database, but shouldn't timeout
          timeout 5 curl -f http://localhost:10000/health || true

      - name: Cleanup
        if: always()
        run: |
          docker stop bookrag-test || true
          docker rm bookrag-test || true

      - name: Check image size
        run: |
          SIZE=$(docker images bookrag:test --format "{{.Size}}")
          echo "Image size: $SIZE"
          # Warn if larger than 500MB
          docker inspect bookrag:test | grep -A 10 'RootFS'
